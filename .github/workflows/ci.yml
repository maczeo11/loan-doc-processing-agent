name: FinScan AI CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Style & Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.3.0"

      - name: Run Ruff Lint Check
        run: |
          ruff check .

  ui-build:
    name: Reviewer SPA Build (Vite + tsc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json

      - name: Install UI Dependencies
        working-directory: apps/ui
        run: npm ci

      - name: Build Reviewer SPA
        working-directory: apps/ui
        run: npm run build

  contracts:
    name: Contract Integrity Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Contract Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pydantic>=2.6.0" "pytest>=8.0.0"

      - name: Verify Contract Schemas
        run: |
          pytest tests/unit/test_contracts.py -v
        env:
          PYTHONPATH: .

  test:
    name: Unit & Smoke Regression Tests
    runs-on: ubuntu-latest
    needs: [lint, contracts]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run Pytest Suite
        run: |
          pytest tests/unit tests/smoke -v --tb=short
        env:
          PYTHONPATH: .
