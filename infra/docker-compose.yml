version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: finscan-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: finscan
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: finscan-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: finscan-api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@db:5432/finscan
      REDIS_URL: redis://redis:6379/0
      QUEUE_BACKEND: postgres
      STORAGE_BACKEND: local
      API_PORT: 8000
    ports:
      - "8000:8000"

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    container_name: finscan-worker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/finscan
      QUEUE_BACKEND: postgres
      STORAGE_BACKEND: local

volumes:
  postgres_data:
  redis_data:
