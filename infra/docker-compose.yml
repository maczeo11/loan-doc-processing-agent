## Docker scope under the systemd-native deploy model: ONLY Postgres, Redis,
## and Caddy run here. api/worker/outbox-dispatcher run natively on the host
## via systemd (infra/systemd/*.service) - see docs/deployment_guide.md.
## 5432/6379 are published to the host (unlike the old all-Docker setup) since
## the native processes reach them via localhost, not a Docker network alias.

services:
  db:
    image: postgres:16-alpine
    container_name: finscan-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: finscan
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finscan"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: finscan-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: finscan-caddy
    # Host networking: the native `api` systemd unit binds 0.0.0.0:8000 on the
    # HOST, not inside any Docker network - Caddy needs to reach it at
    # 127.0.0.1:8000 as seen from the host, which only host networking gives
    # a container. `ports:` below is inert under network_mode: host (Caddy
    # binds 80/443 directly on the host instead) and is left commented for
    # documentation/rollback reference.
    network_mode: host
    # ports:
    #   - "80:80"
    #   - "443:443"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
