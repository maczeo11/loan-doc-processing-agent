[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finscan"
version = "0.1.0"
description = "FinScan AI - Evidence-backed Loan Document Processing Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "langgraph>=0.0.30",
    "langchain-core>=0.1.38",
    "pymupdf>=1.24.0",
    "paddleocr>=2.7.3; sys_platform == 'win32'",
    "sentence-transformers>=2.6.0",
    "faiss-cpu>=1.8.0",
    "rank-bm25>=0.2.2",
    "psycopg[binary]>=3.1.18",
    "redis>=5.0.3",
    "boto3>=1.34.0",
    "scikit-learn>=1.4.1",
    "faker>=24.3.0",
    "reportlab>=4.1.0",
    "pytest>=8.1.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "adapters*", "worker*", "apps*", "ml*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

